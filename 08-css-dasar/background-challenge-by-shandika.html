<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Challenge by Shandika</title>
    <style>
      body {
        text-align: center;
        font-family: "Courier New", Courier, monospace;
        color: azure;
        background-image:
          linear-gradient(
            to bottom,
            rgba(10, 5, 55, 0.9) 40%,
            rgb(10, 5, 55, 0.4)
          ),
          url("https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }
      h1 {
        font-size: 40px;
        font-weight: bold;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 5px;
        /* text-shadow: 1px 1px 7px whitesmoke; */
        background-image: linear-gradient(
          to right,
          rgb(0, 139, 255) 43%,
          rgb(95, 255, 236)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgb(144 238 144 / 55%));
      }
      .isi {
        font-weight: bold;
        line-height: 30px;
        background-color: rgb(255 255 255 / 10%);
        max-width: 500px;
        margin: auto;
        padding: 20px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255 / 15%);
        box-shadow: 0 0 30px rgb(0 0 0 / 50%);
      }
      span {
        font-weight: bold;
        color: crimson;
        text-shadow: 0 0 10px rgb(220 20 60 / 80%);
      }
      .feby {
        font-size: 14px;
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255 / 20%);
        width: 30%;
        margin: auto;
        margin-top: 1px;
        padding-top: 17px;
      }
    </style>
  </head>
  <body>
    <br /><br /><br />
    <h1>Fase Runtuh</h1>
    <div class="box">
      <p class="isi">
        "Tak perlu khawatir, ku hanya <span>~~terluka~~.</span><br />Terbiasa
        tuk pura-pura tertawa <br />Namun bolehkah sekali saja ku menangis?<br />Sebelum
        kembali membohongi diri."
      </p>
    </div>
    <br />
    <p class="feby">-- Feby Putri feat Fiersa Besari --</p>
  </body>
</html>
