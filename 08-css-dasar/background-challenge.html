<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Challenge</title>
    <style>
      body {
        background-color: #008bff;
        background-image: url(images/forestbw.jpg);
        background-size: cover;
      }
      section {
        width: 600px;
        height: 600px;
        margin: auto;
        /* border: 3px solid black; */
        background-image: url(images/forest.jpg);
        background-size: cover;
        background-repeat: no-repeat;
        overflow: hidden;
        background-position: center;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
      }
      h1 {
        font-size: 50px;
        color: goldenrod;
        text-shadow: 2px 2px 5px grey;
        font-weight: bolder;
        background-image: linear-gradient(#008bff #5fffec);
      }
      .box {
        width: 450px;
        height: 140px;
        margin: auto;
        padding-top: 4px;
        line-height: 26px;
        border-radius: 15px;
        background-color: rgba(142, 198, 153, 0.2);
        box-shadow:
          3px 3px 10px rgb(34 34 34 / 50%),
          -3px -3px 10px rgb(34 34 34 / 50%);
        font-weight: bold;
      }
      span {
        color: red;
      }
      .feby {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Fase Runtuh</h1>
      <div class="box">
        <p>
          "Tak perlu khawatir, ku hanya <span>~~terluka~~.</span><br />Terbiasa
          tuk pura-pura tertawa <br />Namun bolehkah sekali saja ku menangis?<br />Sebelum
          kembali membohongi diri."
        </p>
      </div>
      <br />
      <p class="feby">-- Feby Putri feat Fiersa Besari --</p>
    </section>
  </body>
</html>
