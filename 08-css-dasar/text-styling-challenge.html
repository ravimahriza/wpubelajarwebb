<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Challenge</title>
    <style>
      body {
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
        text-align: center;
      }
      .container {
        margin-left: 220px;
        margin-right: 220px;
        padding-left: 50px;
        padding-right: 50px;
        padding-top: 20px;
        padding-bottom: 50px;
        background-color: darkolivegreen;
      }
      .faseruntuh {
        font-size: 70px;
        color: white;
        text-transform: uppercase;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: gray;
        text-shadow: 6px 6px 3px rgb(62, 79, 34);
      }
      .quote {
        font-size: 30px;
        word-spacing: 20px;
        line-height: 50px;
      }
      .terluka {
        text-decoration: line-through;
        color: gray;
      }
      .oleh {
        font-size: 15px;
        word-spacing: 10px;
        color: azure;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="faseruntuh">fase runtuh</h1>
      <p class="quote">
        "Tak perlu khawatir, ku hanya <span class="terluka">~~terluka~~</span>.
        <br />Terbiasa tuk pura-pura tertawa. <br />Namun bolehkah sekali saja
        ku menangis? <br />Sebelum kembali membohongi diri."
      </p>
      <p class="oleh">- Feby Putri feat Fiersa Besari -</p>
    </div>
  </body>
</html>
