<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bakcground Challenge</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        text-align: center;
        color: white;
        background-image:
          linear-gradient(to bottom, rgb(0 0 56 / 90%) 50%, rgb(0 0 56 / 30%)),
          url(https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }
      h1 {
        font-size: 40px;
        font-weight: bolder;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 3px;
        background-image: linear-gradient(
          to right,
          rgb(38, 255, 0) -20%,
          rgb(1, 156, 252)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }
      .konten {
        background-color: rgb(255, 255, 255, 0.2);
        font-weight: bold;
        padding: 20px;
        line-height: 30px;
        max-width: 500px;
        margin: auto;
        border-radius: 20px;
        border: 1px solid rgb(255, 255, 255, 0.4);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      }
      span {
        color: crimson;
        text-shadow: 0 0 10px rgba(220, 20, 60, 0.488);
      }
      .credit {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 3px;
        border-top: 1px solid rgba(255, 255, 255, 0.196);
        width: 30%;
        margin: auto;
        padding-top: 13px;
      }
    </style>
  </head>
  <body>
    <br /><br /><br />
    <h1>Fase Runtuh</h1>
    <div class="box">
      <p class="konten">
        "Tak perlu khawatir, ku hanya <span>~~terluka~~.</span><br />Terbiasa
        tuk pura-pura tertawa <br />Namun bolehkah sekali saja ku menangis?<br />Sebelum
        kembali membohongi diri."
      </p>
    </div>
    <br />
    <p class="credit">-- Feby Putri feat Fiersa Besari --</p>
  </body>
</html>
