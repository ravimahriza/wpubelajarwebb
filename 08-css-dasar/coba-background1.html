<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba CSS Background</title>
    <style>
      body {
        background-color: maroon;
        background-image: url(images/ravi.jpg);
        background-size: 300px;
        background-repeat: repeat-x;
        background-position: left bottom;
        height: 100vh;
      }
      table {
        /* agar table di tengah gunakan display flex dan justify-content center */
        display: flex;
        justify-content: center;
        color: white;
        text-align: center;
        font-family: poppins;
      }
      div {
        margin: 5px;
      }
      .solid {
        width: 200px;
        height: 200px;
        background-color: #efad05;
      }
      .linear {
        width: 200px;
        height: 200px;
        background-image: linear-gradient(to right, #012ee4 50%, #05b6ec);
      }
      .radial {
        width: 200px;
        height: 200px;
        background-color: #efad05;
        background-image: radial-gradient(#055822, #beec05);
      }
      .conic {
        width: 200px;
        height: 200px;
        background-color: #efad05;
        background-image: conic-gradient(#bc260c, #f1e10a);
      }

      .image {
        width: 200px;
        height: 200px;
        background-color: #efad05;
        background-image: url(images/fifin.jpg);
        background-size: 500px;
        background-position: -220px -50px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td>
          <div class="solid"></div>
        </td>
        <td>
          <div class="linear"></div>
        </td>
        <td>
          <div class="radial"></div>
        </td>
        <td>
          <div class="conic"></div>
        </td>
        <td>
          <div id="div1" class="image"></div>
        </td>
      </tr>
      <tr>
        <td>Solid Color</td>
        <td style="font-size: 12px">Linear Gradient Custom Scale</td>
        <td>Radial Gradient</td>
        <td>Conic Gradient</td>
        <td>Image Background</td>
      </tr>
    </table>
  </body>
</html>
