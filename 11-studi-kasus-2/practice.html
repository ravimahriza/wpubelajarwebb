<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      header {
        width: 100%;
        height: 200px;
        background-color: maroon;
        color: white;
        padding: 25px;
        text-align: center;
      }
      header p {
        display: inline-block;
        background-color: white;
        color: maroon;
        font-weight: bold;
        border-radius: 30px;
        margin: 10px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hindia</h1>
      <p>Indie</p>
      <p>Alternative</p>
      <p>Pop</p>
    </header>
  </body>
</html>
