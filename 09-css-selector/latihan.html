<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .google {
        text-align: center;
        font-family: gotham;
        font-size: 20px;
        text-decoration: none;
        color: brown;
      }
      .google:hover {
        color: maroon;
      }
      .google:active {
        font-size: 19.5px;
        color: rgb(183, 1, 1);
      }
      div {
        width: 300px;
        height: auto;
        border: 2px solid maroon;
        border-radius: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.307);
        margin: auto;
        padding: 20px;
        padding-top: 0;
        font-family: poppins;
        font-size: 18px;
      }
      h4 {
        padding: -20px;
      }
      form {
        text-align: center;
      }
      .ravi {
        width: 250px;
        height: 30px;
        font-size: 18px;
        padding: 3px;
        padding-left: 20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <a href="#" class="google">
      <h1>Ahmad Ravi</h1>
    </a>
    <div>
      <h4>Form Pendaftaran :</h4>
      <form>
        <label for="email">Your e-mail :</label> <br />
        <input type="text" class="ravi" id="email" />
      </form>
    </div>
  </body>
</html>
