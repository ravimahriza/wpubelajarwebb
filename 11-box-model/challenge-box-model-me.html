<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge Box Model</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #efefef;
        font-family: Arial, Helvetica, sans-serif;
      }
      .product_card {
        width: 330px;
        margin: auto;
        padding: 24px;
        background-color: white;
        border: 1px solid rgb(243, 243, 243);
        border-radius: 15px;
        box-shadow: 0 10px 20px rgb(0 0 0 / 5%);
      }
      .product_img {
        width: 100%;
        height: 230px;
        margin-bottom: 20px;
        border-radius: 12px;
        overflow: hidden;
      }
      .product_img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .product_category {
        font-size: 12px;
        text-transform: uppercase;
        color: crimson;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }
      .product_name {
        margin-bottom: 10px;
        font-size: 24px;
        font-weight: bold;
        color: #161616;
      }
      .product_desc {
        font-size: 15px;
        color: #666666;
        line-height: 20px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eeeeee;
      }
      .price_section {
        margin-bottom: 25px;
      }
      .price {
        font-size: 24px;
        font-weight: bold;
        color: #161616;
      }
      .original_price {
        font-size: 14px;
        color: #929292;
        margin-left: 10px;
      }
      .size_option_wrapper {
        border: none;
      }
      .size_option_text {
        font-size: 14px;
        color: #161616;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .size_option input[type="radio"] {
        display: none;
      }
      .size_option label {
        display: inline-block;
        width: 44px;
        height: 44px;
        border: 2px solid gray;
        text-align: center;
        line-height: 40px;
        font-weight: bold;
        color: #666666;
        border-radius: 8px;
        margin-right: 8px;
        margin-bottom: 30px;
        transition: 0.2s ease;
      }
      .size_option input[type="radio"]:checked + label {
        background-color: #161616;
        border-color: #161616;
        color: #eeeeee;
      }
      .buy_button {
        width: 100%;
        padding: 20px;
        text-transform: uppercase;
        background-color: #161616;
        color: #eeeeee;
        font-weight: bold;
        letter-spacing: 1px;
        border-radius: 50px;
        transform-origin: center;
        transition: 0.1s ease;
      }
      .buy_button:hover {
        background-color: #2c2c2c;
      }
      .buy_button:active {
        width: 98%;
        height: 98%;
        transform: scale(98%);
      }
    </style>
  </head>
  <body>
    <article class="product_card">
      <figure class="product_img">
        <img src="asset/adizero_adios_pro_4.avif" alt="product-image" />
      </figure>

      <p class="product_category">adidas sportwears</p>
      <h3 class="product_name">Adizero Adios Pro 4</h3>
      <p class="product_desc">
        sepatu lari yang dilengkapi karbon Energyrods 2.0, midsole rocker
        efisien, bantalan ganda Light Strike Pro ultra ringan, dan outsole
        Continental™ Rubber yang antiselip.
      </p>

      <div class="price_section">
        <span class="price">IDR 1,899,999</span>
        <del class="original_price">IDR 2,399,999</del>
      </div>
      <form>
        <fieldset class="size_option_wrapper">
          <legend class="size_option_text">Pilih Ukuran (EUR):</legend>

          <div class="size_option">
            <input type="radio" name="size" id="s40" value="s40" />
            <label for="s40">40</label>

            <input type="radio" name="size" id="s41" value="s41" />
            <label for="s41">41</label>

            <input type="radio" name="size" id="s42" value="s42" />
            <label for="s42">42</label>

            <input type="radio" name="size" id="s43" value="s43" />
            <label for="s43">43</label>

            <input type="radio" name="size" id="s44" value="s44" />
            <label for="s44">44</label>
          </div>
        </fieldset>

        <button class="buy_button" type="submit">tambahkan ke keranjang</button>
      </form>
    </article>
  </body>
</html>
