<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Box Model</title>
    <style>
      /* BORDER STYLE : 
      1. Solid = garis lurus
      2. Dotted = titik-titik
      3. Dashed = garis putus-putus
      4. Ridge = 3D gelap terang
      5. Groove = 3D terang gelap
      6. Double = garis 2 */

      /* Padding dan Border menambah ukuran elemen */
      * {
        margin: 0;
        padding: 0;
      }
      .kotak1 {
        width: 300px;
        height: 300px;
        background-color: lightblue;
        margin: 50px 100px 20px;
        padding: 50px;
        border: 20px groove red;
        box-sizing: border-box;
        /* BOX SIZING bisa dataro di tag (*) biar berlaku secara global */
      }
      .kotak2 {
        width: 200px;
        height: 200px;
        background-color: salmon;
        margin-top: 50px;
        margin-left: 50px;
        padding-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="kotak1">1</div>
    <div class="kotak2">2</div>
  </body>
</html>
